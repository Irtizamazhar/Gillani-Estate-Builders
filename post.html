<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article | Gillani Estate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="post">

  <section class="page-hero">
    <div class="page-hero__bg"><img id="heroBgImg" src="" alt=""></div>
    <div class="container">
      <div class="crumbs fade-up"><a href="index.html">Home</a><span>/</span><a href="blog.html">Blog</a><span>/</span><span id="postCat"></span></div>
      <h1 id="postTitle" class="fade-up" style="max-width:900px"></h1>
      <p id="postMeta" class="fade-up d1"></p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <article class="article reveal">
        <div id="postBody"></div>
        <div class="share"><b>Share</b><span id="share" style="display:contents"></span></div>
      </article>
    </div>
  </section>

  <section class="section section--cream">
    <div class="container">
      <div class="section-head reveal">
        <span class="eyebrow">Keep reading</span>
        <h2>More articles</h2>
      </div>
      <div class="grid-3" id="relatedPosts"></div>
    </div>
  </section>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
